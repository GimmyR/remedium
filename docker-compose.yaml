services:
  db:
    image: postgres:trixie
    container_name: remedium
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - remedium:/var/lib/postgresql
    profiles:
      - prod
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
      start_interval: 5s

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    command: sh -c "npx prisma migrate deploy && node dist/src/main"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    profiles:
      - prod

  api-ci:
    build:
      context: ./api
      dockerfile: Dockerfile.ci
    profiles:
      - ci
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: next-remedium
    environment:
      SERVER_SIDE_TO_API: http://api:8000
    ports:
      - "3000:3000"
    profiles:
      - prod

  front-ci:
    build:
      context: ./front
      dockerfile: Dockerfile.ci
    profiles:
      - ci
      
volumes:
  remedium:
